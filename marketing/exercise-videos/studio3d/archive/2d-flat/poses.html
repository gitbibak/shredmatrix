<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0b1224;display:grid;grid-template-columns:repeat(3,600px);gap:0}svg{width:600px;height:700px;background:radial-gradient(ellipse at 50% 40%,#16213d,#070d1c)}</style>
<script src="../engine/core.js"></script><script src="../engine/draw.js"></script></head><body><script>
const {solve,camera,renderBody,floorShadow,DEFS,expand,capturePlant}=FB;
const stand={abd:6,hrot:12,sh:8,el:12};
const ref=solve(expand(stand),{anchorX:['ankleL','ankleR']});
const plant=capturePlant(ref,['ankleL','ankleR']);
const poses=[
 ['stand side',stand,{yaw:90},{}],
 ['squat side',{trunk:28,hip:120,knee:125,abd:16,hrot:22,sh:45,el:130,shAbd:8},{yaw:90},{plant}],
 ['squat front 3q',{trunk:28,hip:120,knee:125,abd:16,hrot:22,sh:45,el:130,shAbd:8},{yaw:25},{plant}],
 ['pushup bottom',{trunk:80,hip:0,knee:0,ankle:-50,sh:35,el:95,shAbd:20,ground:[['handR',0],['toeR',0]]},{yaw:90},{anchorX:['toeR']}],
 ['bridge',{trunk:-90,hip:-8,knee:100,sh:-8,el:0,ground:[['shoulderR',0],['heelR',0]]},{yaw:90},{}],
 ['lunge',{trunk:2,hipR:95,kneeR:90,hipL:-15,kneeL:95,ankleL:-40,flatL:false,ground:[['heelR',0],['toeL',0]]},{yaw:90},{}],
];
for(const [name,p,c,ctx] of poses){
  const sol=solve(expand(p),Object.assign({anchorX:['ankleL','ankleR']},ctx));
  const cam=camera(Object.assign({scale:330,cx:300,cy:380,target:[0,0.85,0],pitch:6},c));
  document.body.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 600 700">${DEFS}${floorShadow(sol,cam)}${renderBody(sol,cam,{highlight:{}})}<text x="20" y="40" fill="#fff" font-size="22" font-family="sans-serif">${name}</text></svg>`);
}
window.ready=true;
</script></body></html>
