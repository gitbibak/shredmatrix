<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full Balance Hazır Paylaşım Seti</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
      background: #050816;
      color: #f8fbff;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 22px 64px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 28px;
      color: #9aa8bf;
      font-size: 17px;
      line-height: 1.5;
    }
    h2 {
      margin: 34px 0 16px;
      font-size: 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    figure {
      margin: 0;
      border: 1px solid #263654;
      border-radius: 16px;
      overflow: hidden;
      background: #10192b;
    }
    img,
    video {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      border: 0;
      background: #050816;
      object-fit: cover;
    }
    .pin img {
      aspect-ratio: 2 / 3;
    }
    figcaption {
      padding: 12px 14px 14px;
      color: #d5e7f5;
      font-weight: 800;
    }
    code {
      display: block;
      margin-top: 6px;
      color: #9aa8bf;
      font-size: 12px;
      word-break: break-all;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Full Balance Hazır Paylaşım Seti</h1>
    <p>Bu sayfa sadece kontrol içindir. Paylaşım için <strong>png</strong> klasöründeki görselleri ve <strong>mp4</strong> klasöründeki 15 saniyelik videoları kullan.</p>

    <h2>Reels / TikTok Kapakları</h2>
    <section class="grid">
      <figure>
        <img src="png/reels-cover-01-6-modul-tr.png" alt="6 modül tek uygulama" />
        <figcaption>6 modül tanıtım<code>png/reels-cover-01-6-modul-tr.png</code></figcaption>
      </figure>
      <figure>
        <img src="png/reels-cover-02-antrenman-tr.png" alt="Antrenman planını takip et" />
        <figcaption>Antrenman<code>png/reels-cover-02-antrenman-tr.png</code></figcaption>
      </figure>
      <figure>
        <img src="png/reels-cover-03-beslenme-tr.png" alt="Beslenme ve hedef takibi" />
        <figcaption>Beslenme<code>png/reels-cover-03-beslenme-tr.png</code></figcaption>
      </figure>
    </section>

    <h2>Pinterest Pinleri</h2>
    <section class="grid">
      <figure class="pin">
        <img src="png/pin-01-6-modul-tr.png" alt="Ücretsiz 6 modüllü uygulama" />
        <figcaption>6 modül Pinterest<code>png/pin-01-6-modul-tr.png</code></figcaption>
      </figure>
      <figure class="pin">
        <img src="png/pin-02-antrenman-tr.png" alt="Antrenman programı daha net" />
        <figcaption>Antrenman Pinterest<code>png/pin-02-antrenman-tr.png</code></figcaption>
      </figure>
      <figure class="pin">
        <img src="png/pin-03-beslenme-tr.png" alt="Beslenme takibi sade olsun" />
        <figcaption>Beslenme Pinterest<code>png/pin-03-beslenme-tr.png</code></figcaption>
      </figure>
    </section>

    <h2>15 Saniyelik MP4 Videolar</h2>
    <section class="grid">
      <figure>
        <video src="mp4/video-01-6-modul-tr.mp4" controls muted playsinline></video>
        <figcaption>6 modül video<code>mp4/video-01-6-modul-tr.mp4</code></figcaption>
      </figure>
      <figure>
        <video src="mp4/video-02-antrenman-tr.mp4" controls muted playsinline></video>
        <figcaption>Antrenman video<code>mp4/video-02-antrenman-tr.mp4</code></figcaption>
      </figure>
      <figure>
        <video src="mp4/video-03-beslenme-tr.mp4" controls muted playsinline></video>
        <figcaption>Beslenme video<code>mp4/video-03-beslenme-tr.mp4</code></figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
