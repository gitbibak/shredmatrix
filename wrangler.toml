#:schema node_modules/wrangler/config-schema.json
name = "shredmatrix"
compatibility_date = "2025-06-13"
main = "./worker/index.js"
routes = [
  { pattern = "fullbalance.app/*", zone_name = "fullbalance.app" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
html_handling = "drop-trailing-slash"

[ai]
binding = "AI"

[vars]
# Multimodal JSON model tested on meal photos; weights remain estimates.
MEAL_MODEL = "@cf/qwen/qwen3.8-27b"

# Per-IP cap for the meal photo endpoint; period must be 10 or 60 seconds.
[[ratelimits]]
name = "MEAL_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
